<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#08162b">
    <title>{% block title %}DouBanSync{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
<a class="skip-link" href="#main-content">跳到主要内容</a>

<header class="mobile-header">
    <a class="mobile-brand" href="/" aria-label="DouBanSync 首页">
        <img src="{{ url_for('static', filename='img/brand-mark.svg') }}" alt="" width="34" height="34">
        <span>DouBanSync</span>
    </a>
    <button class="mobile-menu-button" id="sidebarToggle" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="打开导航菜单">
        <span></span><span></span><span></span>
    </button>
</header>

<aside class="sidebar" id="sidebar" aria-label="主导航">
    <a class="sidebar-brand" href="/" aria-label="DouBanSync 首页">
        <img src="{{ url_for('static', filename='img/brand-mark.svg') }}" alt="" width="38" height="38">
        <span>DouBanSync</span>
    </a>

    <nav class="sidebar-nav">
        <a href="/" class="sidebar-link{% if request.path == '/' %} active{% endif %}"{% if request.path == '/' %} aria-current="page"{% endif %}>
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
            <span>状态面板</span>
        </a>
        <a href="/config" class="sidebar-link{% if request.path in ['/config', '/cookie-guide'] %} active{% endif %}"{% if request.path in ['/config', '/cookie-guide'] %} aria-current="page"{% endif %}>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/><path d="M4.9 16.5 3.7 18.6l2.8 2.4 1.9-1.1c.7.4 1.4.7 2.2.9l.5 2.2h3.8l.5-2.2c.8-.2 1.5-.5 2.2-.9l1.9 1.1 2.8-2.4-1.2-2.1c.3-.7.5-1.4.6-2.1l2-1.2-.7-3.7-2.3-.4c-.3-.7-.7-1.4-1.2-2l.8-2.2L17 3l-1.7 1.5c-.7-.3-1.5-.4-2.3-.4l-1-2.1-3.6 1.3.1 2.3c-.7.4-1.3.9-1.8 1.5l-2.3-.4-1.9 3.3 1.7 1.6c-.1.4-.1.8-.1 1.2s0 .8.1 1.2l-1.7 1.6 1.9 3.3 2.3-.4c.5.6 1.1 1.1 1.8 1.5"/></svg>
            <span>配置</span>
        </a>
        <a href="/history" class="sidebar-link{% if request.path == '/history' %} active{% endif %}"{% if request.path == '/history' %} aria-current="page"{% endif %}>
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
            <span>同步日志</span>
        </a>
    </nav>

    <div class="sidebar-footer">
        <span class="sidebar-status-dot"></span>
        <span>DouBanSync</span>
        <span class="sidebar-version">v0.3.2</span>
    </div>
</aside>

<button class="sidebar-backdrop" id="sidebarBackdrop" type="button" aria-label="关闭导航菜单"></button>

<main class="main-content" id="main-content" tabindex="-1">
    <div class="content-container">
        {% block content %}{% endblock %}
    </div>
</main>

<script src="{{ url_for('static', filename='vendor/bootstrap/bootstrap.bundle.min.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>
